<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Home Call Guard — Account Confirmed</title>

<style>
  body {
    font-family: Arial;
    background: #0b1220;
    color: white;
    padding: 20px;
    text-align: center;
  }

  h1 {
    color: #00ff99;
    font-size: 26px;
  }

  .box {
    background: #111a2e;
    padding: 30px;
    margin: 20px auto;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
  }

  p {
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.5;
  }

  .primary-button {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    background-color: #00ff99;
    color: black;
    border: none;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }

  .legal-links {
    margin-top: 24px;
    color: #64748b;
    font-size: 12px;
  }

  .legal-links a {
    color: #94a3b8;
    text-decoration: none;
  }

  .legal-links a:hover {
    color: #00ff99;
  }
</style>
</head>

<body>

<img src="/logo.png" style="height:130px; margin-bottom:10px;">

<h1 id="heading">Account confirmed</h1>

<div class="box">
  <p id="message">Your email address has been confirmed and your account is now active.</p>
  <a class="primary-button" id="loginLink" href="/login.html">Log In</a>
</div>

<div class="legal-links">
  <a href="/terms.html">Terms and Conditions</a> · <a href="/privacy.html">Privacy Policy</a>
</div>

<script>
  // Supabase's confirmation redirect appends the real session as a URL
  // fragment (#access_token=...&refresh_token=...) — never sent to the
  // server, but readable here. If present and valid, this continues
  // straight into the dashboard instead of asking for the password
  // again.
  //
  // 2026-09-20 — real production reproduction proved the automatic
  // session handoff can fail even though confirmation itself genuinely
  // succeeded (Supabase only ever redirects here after the email is
  // verified) — most likely because the one-time verification
  // token/link had already been consumed before this browser opened it.
  // Rather than leave the customer on a dead-end page, every failure
  // path below now sends them straight to /login.html with a clear
  // "already confirmed" message and their email pre-filled wherever
  // it's available, so they only ever have to type their password once
  // more — never their email again, never a fresh confirmation. This
  // never bypasses Supabase's own authentication: /login still requires
  // the real password via supabase.auth.signInWithPassword, and nothing
  // here stores or transmits a password.

  // Same-browser convenience set by register.html right before it
  // submits the signup form — read back here only as a fallback for
  // pre-filling the login form's email field, never trusted for
  // authentication. Key must match register.html's PENDING_EMAIL_KEY.
  var PENDING_EMAIL_KEY = "hcg_pending_confirmation_email";

  function readPendingEmail() {
    try {
      return sessionStorage.getItem(PENDING_EMAIL_KEY);
    } catch (e) {
      return null;
    }
  }

  function clearPendingEmail() {
    try {
      sessionStorage.removeItem(PENDING_EMAIL_KEY);
    } catch (e) {}
  }

  // Reads the `email` claim straight out of the confirmation link's own
  // access_token JWT. Deliberately NOT verified client-side — there is
  // no key to verify it with in a browser, and none is needed, because
  // this value is only ever used to pre-fill a form field. The real
  // authentication still happens on /login via Supabase's own
  // signInWithPassword. Falls back to null on anything malformed.
  function decodeEmailFromToken(token) {
    try {
      var payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      while (payload.length % 4) payload += "=";
      var claims = JSON.parse(atob(payload));
      return typeof claims.email === "string" ? claims.email : null;
    } catch (e) {
      return null;
    }
  }

  function goToLoginFallback(prefillEmail) {
    clearPendingEmail();
    var url = "/login.html?state=confirmed";
    if (prefillEmail) url += "&email=" + encodeURIComponent(prefillEmail);
    window.location.replace(url);
  }

  // Hands a real access_token/refresh_token pair to the existing,
  // unchanged /confirm-session endpoint — the exact same secure session-
  // establishment mechanism both the TokenHash path (below) and the
  // legacy hash-fragment path (further below) use. tokenForFallback is
  // only ever used to pre-fill the login form's email if this last step
  // fails after an otherwise-successful verification.
  function establishSession(accessToken, refreshToken, expiresIn, tokenForFallback) {
    document.getElementById("message").textContent = "Taking you to your dashboard…";
    document.getElementById("loginLink").hidden = true;

    fetch("/confirm-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken, expires_in: expiresIn }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("confirm-session failed");
        clearPendingEmail();
        window.location.href = "/dashboard";
      })
      .catch(function () {
        goToLoginFallback(decodeEmailFromToken(tokenForFallback) || readPendingEmail());
      });
  }

  (function () {
    // 2026-09-20 — TokenHash confirmation path (primary, once the
    // Supabase "Confirm signup" email template is updated to link here
    // with ?token_hash=...&type=signup instead of Supabase's own direct
    // /auth/v1/verify link). Verification only happens from this actual
    // page-JS fetch call, never from the plain GET that loads this
    // page's HTML — so an automated email-security link scanner (which
    // fetches/previews a URL but does not execute page JavaScript) can
    // no longer prematurely consume the one-time token before the real
    // customer taps the link. This is the actual root cause fix for the
    // real-device failure the hash-fragment path's fallback was only
    // ever able to paper over. See routes/mobileApi.js and this file's
    // header comment for the fallback this preserves unchanged.
    var queryParams = new URLSearchParams(window.location.search);
    var tokenHash = queryParams.get("token_hash");
    var tokenHashType = queryParams.get("type");

    if (tokenHash && tokenHashType === "signup") {
      document.getElementById("message").textContent = "Confirming your email…";
      document.getElementById("loginLink").hidden = true;

      fetch("/verify-confirmation-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token_hash: tokenHash, type: tokenHashType }),
      })
        .then(function (res) {
          if (!res.ok) throw new Error("verify-confirmation-token failed");
          return res.json();
        })
        .then(function (data) {
          establishSession(data.access_token, data.refresh_token, data.expires_in, data.access_token);
        })
        .catch(function () {
          // token_hash missing/invalid/expired/already used — no
          // session was ever issued, so there is no token to decode an
          // email from here; the same-browser sessionStorage value (if
          // any) is the only recovery source.
          goToLoginFallback(readPendingEmail());
        });
      return;
    }

    // Legacy path — Supabase's own confirmation redirect appends the
    // real session as a URL fragment (#access_token=...&refresh_token=
    // ...) directly, for any confirmation link sent before the email
    // template change above (or if it's ever reverted). Never sent to
    // the server, but readable here. Kept fully intact, unchanged
    // behaviour, as the fallback for exactly that case.
    var hash = window.location.hash ? window.location.hash.slice(1) : "";
    var hashParams = new URLSearchParams(hash);
    var accessToken = hashParams.get("access_token");
    var refreshToken = hashParams.get("refresh_token");
    var expiresIn = hashParams.get("expires_in");

    if (!accessToken || !refreshToken) {
      // No usable session tokens in this redirect at all — the most
      // likely cause is the one-time verification token having already
      // been consumed. Confirmation is still real; only the automatic
      // handoff failed.
      goToLoginFallback(readPendingEmail());
      return;
    }

    establishSession(accessToken, refreshToken, expiresIn, accessToken);
  })();
</script>

</body>
</html>
