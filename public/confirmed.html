<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Home Call Guard — Account Confirmed</title>

<style>
  body {
    font-family: Arial;
    background: #0b1220;
    color: white;
    padding: 20px;
    text-align: center;
  }

  h1 {
    color: #00ff99;
    font-size: 26px;
  }

  .box {
    background: #111a2e;
    padding: 30px;
    margin: 20px auto;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
  }

  p {
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.5;
  }

  .primary-button {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    background-color: #00ff99;
    color: black;
    border: none;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }

  .legal-links {
    margin-top: 24px;
    color: #64748b;
    font-size: 12px;
  }

  .legal-links a {
    color: #94a3b8;
    text-decoration: none;
  }

  .legal-links a:hover {
    color: #00ff99;
  }
</style>
</head>

<body>

<img src="/logo.png" style="height:130px; margin-bottom:10px;">

<h1 id="heading">Account confirmed</h1>

<div class="box">
  <p id="message">Your email address has been confirmed and your account is now active.</p>
  <a class="primary-button" id="loginLink" href="/login.html">Log In</a>
</div>

<div class="legal-links">
  <a href="/terms.html">Terms and Conditions</a> · <a href="/privacy.html">Privacy Policy</a>
</div>

<script>
  // Supabase's confirmation redirect appends the real session as a URL
  // fragment (#access_token=...&refresh_token=...) — never sent to the
  // server, but readable here. If present and valid, this continues
  // straight into the dashboard instead of asking for the password
  // again. Any failure (no fragment at all, expired/invalid tokens, a
  // network error) falls back to the plain "Log In" link already in the
  // page — never a dead end.
  (function () {
    var hash = window.location.hash ? window.location.hash.slice(1) : "";
    if (!hash) return;

    var params = new URLSearchParams(hash);
    var accessToken = params.get("access_token");
    var refreshToken = params.get("refresh_token");
    var expiresIn = params.get("expires_in");

    if (!accessToken || !refreshToken) return;

    document.getElementById("message").textContent = "Taking you to your dashboard…";
    document.getElementById("loginLink").hidden = true;

    fetch("/confirm-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken, expires_in: expiresIn }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("confirm-session failed");
        window.location.href = "/dashboard";
      })
      .catch(function () {
        document.getElementById("message").textContent = "Your email address has been confirmed and your account is now active.";
        document.getElementById("loginLink").hidden = false;
      });
  })();
</script>

</body>
</html>
