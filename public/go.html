<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a07">
<meta name="robots" content="noindex">

<title>Home Call Guard</title>
<meta name="description" content="Another layer of protection for you and your family. Protect yourself and the people you care about from scam calls.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Home Call Guard">
<meta property="og:title" content="Home Call Guard">
<meta property="og:description" content="Another layer of protection for you and your family.">
<meta property="og:image" content="https://homecallguard.co.uk/logo.png">

<link rel="preload" as="image" href="/hcg-shield.png">

<!-- /go is the permanent "link in bio" / QR / press landing page: routes
     into the product only. Deliberately no JavaScript, no third-party
     requests, no pricing, no login and no email capture — one image,
     inline CSS. Served by server.js's GET /go via services/goLanding.js,
     which decides whether the App Store button is live (see the markers)
     and forwards utm_* onto the landline sign-up link. -->
<style>
  :root {
    --bg: #050a07;
    --card: #0c130f;
    --border: #1d2b23;
    --border-strong: #2b4136;
    --text: #f3f7f4;
    --muted: #98a99f;
    --green: #3cf07a;
    --green-deep: #18dd56;
    --green-soft: rgba(60, 240, 122, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(60, 240, 122, 0.13), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    text-align: center;
  }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }

  .shield-ring {
    width: 160px; height: 160px; border-radius: 50%;
    background: var(--green-soft);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  .shield-ring div {
    width: 120px; height: 120px; border-radius: 50%;
    background: #0a2014; border: 1px solid var(--green-deep);
    display: flex; align-items: center; justify-content: center;
  }
  .shield-ring img { width: 84px; height: 84px; display: block; }

  h1 { font-size: 2.05rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  h1 span { color: var(--green); }
  .lead { font-size: 1.28rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; margin-top: 14px; max-width: 18em; }
  .sub { color: var(--muted); font-size: 1rem; margin-top: 12px; max-width: 21em; }

  .stores { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  .store {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 68px; padding: 10px 18px;
    border-radius: 16px; border: 1.5px solid var(--green);
    background: var(--card); color: var(--text); text-decoration: none;
    box-shadow: 0 0 28px rgba(60, 240, 122, 0.16);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .store:active { transform: scale(0.98); box-shadow: 0 0 16px rgba(60, 240, 122, 0.14); }
  .store:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  .store small { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .store strong { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }

  /* Landline: a real, active route but visually a step below Google Play. */
  .store.alt { min-height: 64px; box-shadow: none; border-color: var(--border-strong); }
  .store.alt:active { transform: scale(0.98); }
  .store.alt strong { font-size: 1.15rem; }
  .store.alt span { font-size: 0.85rem; color: var(--muted); line-height: 1.3; }

  /* Not-yet-available state: visibly disabled, not a link, not focusable. */
  .store.disabled {
    border-color: var(--border-strong); border-style: dashed; background: transparent;
    box-shadow: none; cursor: default; pointer-events: none; color: #8a9b91;
  }
  .store.disabled small { color: #6f8177; }

  .learn { margin-top: 20px; padding: 10px 6px; font-size: 0.9rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }
  .learn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  footer { margin-top: 14px; display: flex; gap: 18px; font-size: 0.8rem; }
  footer a { color: var(--muted); text-decoration: none; padding: 11px 8px; }
  footer a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  @media (min-width: 720px) { .lead { font-size: 1.4rem; } }

  /* Short screens (phones, and in-app browsers like TikTok's that lose height
     to their own toolbars): progressively tighter so the whole page —
     both store buttons, the landline route, Learn more, Privacy/Terms —
     stays on screen without scrolling. */
  @media (max-height: 760px) {
    body { padding-top: 18px; padding-bottom: 12px; }
    .shield-ring { width: 118px; height: 118px; margin-bottom: 14px; }
    .shield-ring div { width: 88px; height: 88px; }
    .shield-ring img { width: 62px; height: 62px; }
    h1 { font-size: 1.75rem; }
    .lead { font-size: 1.12rem; margin-top: 8px; }
    .sub { font-size: 0.9rem; margin-top: 6px; }
    .stores { margin-top: 18px; gap: 9px; }
    .store { min-height: 58px; padding: 8px 16px; }
    .store strong { font-size: 1.28rem; }
    .store.alt { min-height: 58px; }
    .store.alt strong { font-size: 1.08rem; }
    .learn { margin-top: 10px; padding: 8px 6px; }
    footer { margin-top: 2px; }
    footer a { padding: 9px 8px; }
  }
  @media (max-height: 640px) {
    body { padding-top: 12px; padding-bottom: 8px; }
    .shield-ring { width: 92px; height: 92px; margin-bottom: 10px; }
    .shield-ring div { width: 70px; height: 70px; }
    .shield-ring img { width: 48px; height: 48px; }
    h1 { font-size: 1.55rem; }
    .lead { font-size: 1.02rem; margin-top: 6px; }
    .sub { display: none; }
    .stores { margin-top: 14px; gap: 8px; }
    .store, .store.alt { min-height: 52px; padding: 6px 14px; }
    .store strong { font-size: 1.15rem; }
    .store.alt strong { font-size: 1rem; }
    .store.alt span { font-size: 0.78rem; }
    .learn { margin-top: 4px; padding: 8px 6px; font-size: 0.85rem; }
    footer { margin-top: 0; }
    footer a { padding: 8px 8px; }
  }
</style>
</head>
<body>
<main>
  <div class="shield-ring"><div><img src="/hcg-shield.png" width="84" height="84" alt=""></div></div>

  <h1>Home Call <span>Guard</span></h1>
  <p class="lead">Another layer of protection for you and your family.</p>
  <p class="sub">Protect yourself and the people you care about from scam calls.</p>

  <div class="stores">
    <a class="store" id="googlePlay" href="https://play.google.com/store/apps/details?id=co.uk.homecallguard.app" rel="noopener">
      <small>Get it on</small>
      <strong>Google Play</strong>
    </a>
    <!--APP_STORE_BUTTON_START-->
    <div class="store disabled" id="appStore" aria-disabled="true">
      <small>Coming soon on the</small>
      <strong>App Store</strong>
    </div>
    <!--APP_STORE_BUTTON_END-->
    <a class="store alt" id="landline" href="/register.html" rel="noopener">
      <strong>Protect a landline</strong>
      <span>Set up Home Call Guard for your home phone</span>
    </a>
  </div>

  <a class="learn" id="learnMore" href="/">Learn more about Home Call Guard</a>

  <footer>
    <a href="/privacy">Privacy</a>
    <a href="/terms.html">Terms</a>
  </footer>
</main>
</body>
</html>
