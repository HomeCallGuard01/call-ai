  ['Genuine customer', 'Explicitly classified as a genuine customer. Never inferred.'],
  ['Internal test / reviewer / admin / QA', 'Explicitly classified non-customer accounts. Visible everywhere, never counted as customers or revenue.'],
  ['Unclassified', 'Not yet classified. Not counted as a customer or revenue until classified.'],
  ['Paid / complimentary / trial access', 'The type of the current entitlement.'],
  ['Genuine paying customer', 'A genuine customer with paid access now.'],
  ['Payment history / former paying', 'A paid membership was recorded at some point (any status); former paying = no paid access now. Stripe test / Apple sandbox rows look the same, so this is not proof money was received.'],
  ['Cancelled', 'No current or upcoming membership; the subscription was cancelled or access revoked.'],
  ['Expired', 'No current or upcoming membership; the last one ended by date.'],
  ['Protected', 'Current membership + delivery confirmed + app registered (the customer-facing definition).'],
  ['Entitled but not protected', 'Current membership, not (yet) Protected.'],
  ['Revenue / MRR', 'Money from genuine customers only, read from the payment provider. Never an entitlement count multiplied by the list price.'],
];

// Overview cards in three groups, so the page reads top-down:
// who are my customers → are they protected → what am I paying for.
const OVERVIEW_GROUPS = [
  { title: 'Customers & revenue', ids: ['genuine_paying', 'paid_unclassified', 'non_paying_access', 'mrr'] },
  { title: 'Protection', ids: ['protected', 'entitled_not_protected', 'entitled_missing_number'] },
  { title: 'Numbers & cost', ids: ['provider_numbers', 'households_with_number', 'unmapped_numbers', 'lapsed_retaining_number', 'pending_release_quarantine', 'lifecycle_anomalies'] },
];

function groupOverviewCards(cards) {
  const byId = new Map((cards || []).map((c) => [c.id, c]));
  const used = new Set();
  const groups = OVERVIEW_GROUPS.map((g) => ({ title: g.title, cards: g.ids.map((id) => byId.get(id)).filter(Boolean) }));
  for (const g of groups) for (const c of g.cards) used.add(c.id);
  const rest = (cards || []).filter((c) => !used.has(c.id));
  if (rest.length) groups.push({ title: 'Other checks', cards: rest });
  return groups.filter((g) => g.cards.length);
}

// "Needs your attention" (2026-09-29): actionable exceptions only,
// grouped by topic and de-duplicated by household, each with WHAT / WHO /
// WHEN / WHY / NEXT. Pure: takes the cached payloads (any may be null).
// Deliberately excluded: "entitled but not protected" (new customers
// setting up — Customers raises it only once overdue), info counts, and
// green/grey cards (grey feeds the single data-freshness item).
const ATTENTION_TOPICS = {
  delivery: { title: 'Calls not reaching customers', why: 'A customer who believes they are protected may be missing calls.', next: 'Open the customer: check the latest call\'s Twilio and phone outcome and whether the app is registered; contact them if the app was offline.', tab: 'customers' },
  voice_sdk: { title: 'App not registered for calls', why: 'Calls forwarded to HCG cannot ring the customer\'s phone.', next: 'Ask the customer to open the app (it re-registers) and check the app version.', tab: 'customers' },
  provisioning: { title: 'Entitled households without a working HCG number', why: 'The customer cannot forward calls anywhere.', next: 'Retry provisioning (Operations → Admin tools, household ID); check the recorded error.', tab: 'customers' },
  setup_overdue: { title: 'Setup overdue', why: 'Paying for protection that is not active yet.', next: 'Contact the customer to finish forwarding setup; check network/device are recorded.', tab: 'customers' },
  number_lifecycle: { title: 'Number lifecycle anomalies', why: 'A number may be released from someone who still needs it, or kept (and billed) for someone who does not.', next: 'Open Numbers and follow each row\'s next step. Nothing is released from the dashboard.', tab: 'numbers' },
  numbers_cost: { title: 'Numbers billed with no customer behind them', why: 'Recurring rental for staging, orphan or unmapped numbers.', next: 'Open Numbers: check each number\'s inbound calls and environment before any decision.', tab: 'numbers' },
  classification: { title: 'Accounts that need classifying', why: 'Unclassified accounts are in no customer or revenue figure — a real payer can be invisible.', next: 'Customers → View → Classification (reason required; no effect on access or billing).', tab: 'customers' },
  payments: { title: 'Payments not attributed', why: 'Revenue figures exclude these until they are.', next: 'Open Money; classify the paying account, or note App Store revenue is not connected.', tab: 'money' },
  finance: { title: 'Spend safety', why: 'Provider spend is above normal, or cannot be observed.', next: 'Open Money: read the level reasons and check the provider console. Recommended actions are listed; none are executed.', tab: 'money' },
  system: { title: 'System components not confirmed healthy', why: 'Calls, payments or alerts may be failing silently.', next: 'Operations → System health: each component states its evidence.', tab: 'operations' },
  other_checks: { title: 'Other checks flagged', why: 'A dashboard check found something outside its normal state.', next: 'Open the Overview card for its rule and the affected items.', tab: 'overview' },
  data_freshness: { title: 'Some checks could not run', why: 'Missing data is not the same as zero or "fine".', next: 'Treat these figures as unknown until their source is connected or refreshed.', tab: 'overview' },
};
const CARD_TOPIC = {
  entitled_missing_number: 'provisioning', lifecycle_anomalies: 'number_lifecycle', lapsed_retaining_number: 'number_lifecycle',
  pending_release_quarantine: 'number_lifecycle', unmapped_numbers: 'numbers_cost', paid_unclassified: 'classification',
  non_paying_access: 'classification', mrr: 'payments',
};
const ATTENTION_SEVERITY_RANK = { red: 0, amber: 1 };

function customerTopic(row) {
  const reason = String(row.healthReason || '');
  if (row.lastDelivery && row.lastDelivery.failure) return 'delivery';
  if (/deliver/i.test(reason)) return 'delivery';
  if (/app|voice sdk|registered/i.test(reason)) return 'voice_sdk';
  if (/provision|hcg number|number problem/i.test(reason)) return 'provisioning';
  return 'setup_overdue';
}

function buildAttentionItems(overview, customers, business) {
  const groups = new Map();
  const add = (topic, severity, { detail = null, who = [], when = null } = {}) => {
    if (!ATTENTION_TOPICS[topic]) return;
    const g = groups.get(topic) || { topic, ...ATTENTION_TOPICS[topic], severity, details: [], who: new Map(), when: null };
    if (ATTENTION_SEVERITY_RANK[severity] < ATTENTION_SEVERITY_RANK[g.severity]) g.severity = severity;
    if (detail && !g.details.includes(detail)) g.details.push(detail);
    for (const w of who) {
      const key = w.householdId || w.number || w.email;
      if (!key) continue;
      const prev = g.who.get(key);
      g.who.set(key, { label: w.email || w.number || String(w.householdId).slice(0, 8), detail: prev && prev.detail && w.detail && prev.detail !== w.detail ? prev.detail + '; ' + w.detail : (prev && prev.detail) || w.detail || null });
    }
    if (when && (!g.when || when > g.when)) g.when = when;
    groups.set(topic, g);
  };

  if (overview && overview.cards) {
    for (const c of overview.cards) {
      if (c.status === 'grey') { add('data_freshness', 'amber', { detail: c.label + ': ' + c.value }); continue; }
      if (c.status !== 'red' && c.status !== 'amber') continue;
      if (c.id === 'entitled_not_protected') continue; // normal setup; Customers raises it once overdue
      // A new check without a topic is never dropped silently.
      const topic = CARD_TOPIC[c.id] || 'other_checks';
      // Only the unclassified part of "non-paying access" is actionable.
      const items = c.id === 'non_paying_access' ? (c.items || []).filter((i) => /unclassified/.test(i.detail || '')) : (c.items || []);
      if (c.id === 'non_paying_access' && !items.length) continue;
      add(topic, c.status, { detail: c.label + ': ' + (c.id === 'non_paying_access' ? items.length + ' unclassified with access' : c.value), who: items });
    }
  }
  if (overview && overview.financialSafety) {
    const f = overview.financialSafety;
    if (f.state === 'stale' || f.state === 'load_failed') add('finance', 'red', { detail: f.state === 'stale' ? 'Cost data is stale — spend since then is unobserved' : 'Cost data could not be loaded', when: f.asOf });
    if (f.level === 'EMERGENCY' || f.level === 'ALERT') add('finance', 'red', { detail: 'Level ' + f.level, when: f.asOf });
    else if (f.level === 'WATCH') add('finance', 'amber', { detail: 'Level WATCH', when: f.asOf });
    for (const w of f.warnings || []) if (w.severity === 'critical') add('finance', 'red', { detail: w.text, when: f.asOf });
  }
  if (customers && customers.rows) {
    for (const r of customers.rows) {
      if (r.deletedAccount || r.health !== 'needs_attention') continue;
      const when = (r.lastDelivery && r.lastDelivery.at) || (r.latestCall && r.latestCall.at) || null;
      add(customerTopic(r), 'red', { who: [{ householdId: r.householdId, email: r.email, detail: r.healthReason }], when });
    }
  }
  if (business && business.systemHealth) {
    for (const [name, comp] of Object.entries(business.systemHealth.components || {})) {
      if (comp.status === 'RED') add('system', 'red', { detail: name + ' — ' + comp.reason, when: business.generatedAt });
      else if (comp.status === 'AMBER') add('system', 'amber', { detail: name + ' — ' + comp.reason, when: business.generatedAt });
    }
  }

  return [...groups.values()]
    .map((g) => ({ topic: g.topic, severity: g.severity, what: g.title, details: g.details, who: [...g.who.values()], affected: g.who.size, when: g.when, why: g.why, next: g.next, tab: g.tab }))
    .sort((x, y) => ATTENTION_SEVERITY_RANK[x.severity] - ATTENTION_SEVERITY_RANK[y.severity] || y.affected - x.affected);
}

function renderAttentionItemHtml(it) {
  const whoList = it.who.slice(0, 3).map((w) => escapeHtml(w.label)).join(', ') + (it.who.length > 3 ? ' +' + (it.who.length - 3) + ' more' : '');
  let html = '<li class="att-' + escapeHtml(it.severity) + '"><div class="att-body">' +
    '<div class="att-what">' + statusBadge(it.severity) + ' <strong>' + escapeHtml(it.what) + '</strong>' + (it.affected ? ' <span class="customer-sub">(' + it.affected + ')</span>' : '') + '</div>';
  if (it.details.length) html += '<div class="customer-sub">' + it.details.slice(0, 3).map(escapeHtml).join(' · ') + (it.details.length > 3 ? ' · +' + (it.details.length - 3) : '') + '</div>';
  if (it.who.length) html += '<div class="customer-sub">Affects: ' + whoList + '</div>';
  if (it.when) html += '<div class="customer-sub">Latest: ' + escapeHtml(fmtDateTime(it.when)) + '</div>';
  html += '<div class="customer-sub">Why it matters: ' + escapeHtml(it.why) + '</div>';
  html += '<div class="customer-sub">Next: ' + escapeHtml(it.next) + ' <a href="#' + escapeHtml(it.tab) + '" onclick="switchTab(\'' + escapeHtml(it.tab) + '\');return false;">open</a></div>';
  if (it.who.length > 3) html += '<details><summary class="customer-sub">All affected</summary><ul class="sub">' + it.who.map((w) => '<li>' + escapeHtml(w.label) + (w.detail ? ' — ' + escapeHtml(w.detail) : '') + '</li>').join('') + '</ul></details>';
  return html + '</div></li>';
}

function renderAttentionStrip() {
  const el = document.getElementById('attention');
  if (!el) return;
  // typeof guards: these page globals are declared outside this block.
  const customers = typeof customerMonitorData !== 'undefined' ? customerMonitorData : null;
  const business = typeof lastBusinessData !== 'undefined' ? lastBusinessData : null;
  const items = buildAttentionItems(businessControlCache.overview, customers, business);
  const pending = [!businessControlCache.overview && 'checks', !customers && 'customers', !business && 'system health'].filter(Boolean);
  let html = '<div class="section"><div class="section-header"><h2>Needs your attention' + (items.length ? ' (' + items.length + ')' : '') + '</h2></div>';
  if (!items.length) {
    const base = businessControlCache.overview ? overallBanner(businessControlCache.overview).text : 'Nothing found yet';
    html += '<div class="readiness-banner ready">' + escapeHtml(base) + (pending.length ? ' · still loading ' + escapeHtml(pending.join(', ')) : '') + '</div>';
  } else {
    html += '<ul class="attention-list">' + items.map(renderAttentionItemHtml).join('') + '</ul>';
    if (pending.length) html += '<p class="sub">Still loading: ' + escapeHtml(pending.join(', ')) + '</p>';
  }
  html += '</div>';
  el.innerHTML = html;
}

  html += '<h3 style="margin-top:14px;">What HCG pays for — every number on the provider account</h3>';
  html += inventoryHtml(overview && overview.inventory, overview ? overview.inventoryReason : 'overview unavailable');
  html += '<h3 style="margin-top:26px;">Household lifecycle</h3>';
  html += '<div class="readiness-banner ' + banner.className + '">' + escapeHtml(banner.text) + '</div>';
  if (!d.rows.length) {
    html += '<div class="empty-state">No households with an entitlement, number or quarantine.</div>';
  } else {
    html += '<div class="customer-table-wrap"><table class="customer-table"><thead><tr><th>Household</th><th>Status</th><th>Issues</th><th>Lifecycle</th></tr></thead><tbody>';
    for (const r of d.rows.filter((x) => !x.providerOnly)) {
      const statusPill = r.status === 'action_required' ? '<span class="status-pill bad">Action</span>' : r.status === 'watch' ? '<span class="status-pill warn">Watch</span>' : '<span class="status-pill good">OK</span>';
      const issues = r.anomalies.length ? r.anomalies.map((a) => '<div class="' + (a.severity === 'action' ? 'text-bad' : 'text-warn') + '">' + escapeHtml(a.label) + (a.detail ? '<span class="customer-sub"> — ' + escapeHtml(a.detail) + '</span>' : '') + '</div>').join('') : '<span class="text-muted">—</span>';
      html += '<tr><td class="cell-customer"><div class="customer-email">' + escapeHtml(r.email || (r.numberOnly ? 'Deleted account' : '—')) + '</div><div class="customer-sub">' + escapeHtml(r.hcgNumber || 'no number') + '</div></td>' +
        '<td>' + statusPill + '</td><td class="cell-wrap">' + issues + '</td><td class="cell-chain">' + timelineHtml(r.timeline) + '</td></tr>';
    }

  }

  html += '<ul class="sub" style="margin-top:12px;">' + d.notes.map((n) => '<li>' + escapeHtml(n) + '</li>').join('') + '</ul>';
  html += '</div>';
  document.getElementById('reconciliation').innerHTML = html;
}

// ---------- Finance ----------
const FINANCE_SECTION_TITLES = { revenue: 'Revenue', direct: 'Direct costs', overhead: 'Infrastructure &amp; other', marketing: 'Marketing (shown separately)' };

// Spend safety (Pricing Safety's layer, adapted by
// services/businessControl/financialSafetyAdapter.js). Missing, failed or
// stale data is stated, never shown as £0; recommended actions are
// displayed only — nothing here runs them.
const SAFETY_LEVEL_CLASS = { NORMAL: 'ready', WATCH: 'ready_with_open_items', ALERT: 'not_ready', EMERGENCY: 'not_ready' };

function safetyMoney(v) {
  return v === null || v === undefined ? provenanceBadge('NOT_CONNECTED') : escapeHtml(formatGbpOrMissing(v));
}

function renderSafetyHtml(safety) {
  if (!safety) return '';
  let html = '<h3>Spend safety</h3>';
  if (safety.state === 'not_connected' || safety.state === 'load_failed') {
    html += '<div class="readiness-banner ' + (safety.state === 'load_failed' ? 'not_ready' : 'ready_with_open_items') + '">' + (safety.state === 'load_failed' ? 'Cost data could not be loaded — spend is unobserved, not zero' : 'Not connected') + '</div>';
    html += '<p class="sub">' + escapeHtml(safety.reason || '') + ' MRR, spend by component, trusted / monitored call cost, household outliers, projected month-end and the WATCH / ALERT / EMERGENCY level appear here once it is.</p>';
    return html;
  }
  const levelClass = SAFETY_LEVEL_CLASS[safety.level] || 'not_ready';
  html += '<div class="readiness-banner ' + (safety.state === 'stale' ? 'not_ready' : levelClass) + '">Level: ' + escapeHtml(safety.level || 'unknown') + (safety.state === 'stale' ? ' · STALE DATA' : '') + ' · as of ' + escapeHtml(fmtDateTime(safety.asOf)) + (safety.ageHours !== null ? ' (' + escapeHtml(String(safety.ageHours)) + 'h ago)' : '') + '</div>';
  if (safety.warnings && safety.warnings.length) html += '<ul class="sub">' + safety.warnings.map((w) => '<li class="' + (w.severity === 'critical' ? 'text-bad' : 'text-warn') + '">' + escapeHtml(w.text) + '</li>').join('') + '</ul>';
  if (safety.levelReasons && safety.levelReasons.length) html += '<details><summary>Why this level</summary><ul class="sub">' + safety.levelReasons.map((r) => '<li>' + escapeHtml(r) + '</li>').join('') + '</ul></details>';
  const c = safety.company || {};
  html += '<div class="cards">' +
    bcCard('Telephony spend today', safetyMoney(c.todaySpendGbp), 'ledger, all quality levels') +
    bcCard('Month to date', safetyMoney(c.monthToDateGbp), c.unknownItems ? escapeHtml(c.unknownItems + ' item(s) not yet priced — not £0') : 'all items priced') +
    bcCard('Projected month-end', safetyMoney(c.projectedMonthEndGbp), escapeHtml(c.projectionBasis || '')) +
    bcCard('Unallocated', safetyMoney(c.unallocatedGbp), 'no household (never spread across customers)') +
    bcCard('Trusted-call cost', safetyMoney(safety.split && safety.split.trustedCallCostGbp), 'inbound leg of known-contact calls + app leg') +
    bcCard('Monitored-call cost', safetyMoney(safety.split && safety.split.monitoredCallCostGbp), 'unknown-caller leg + streams + AI + TTS') +
    bcCard('Number rental (households)', safetyMoney(safety.split && safety.split.numberRentalGbp), 'unattributed rental is in Unallocated') +
    bcCard('Loss-making households (projected)', c.projectedLossMakingHouseholds === null || c.projectedLossMakingHouseholds === undefined ? provenanceBadge('NOT_CONNECTED') : fmtNum(c.projectedLossMakingHouseholds), 'internal fair-use review only') +
    '</div>';
  if (safety.components && safety.components.length) {
    html += '<table class="pnl-table" style="margin-top:12px;"><tr><th>Component (month to date)</th><th>Amount</th></tr>' + safety.components.map((x) => '<tr><td>' + escapeHtml(x.label) + '</td><td>' + safetyMoney(x.amountGbp) + '</td></tr>').join('') + '</table>';
  }
  if (safety.outliers && safety.outliers.length) {
    html += '<h3 style="margin-top:14px;">Highest-cost households (projected)</h3><table><tr><th>Household</th><th>Month to date</th><th>Projected month</th><th>Projected contribution</th><th>Trusted / monitored min</th></tr>' +
      safety.outliers.map((o) => '<tr><td>' + escapeHtml(o.householdRef) + '…</td><td>' + safetyMoney(o.monthToDateGbp) + '</td><td>' + safetyMoney(o.projectedMonthGbp) + '</td><td class="' + (o.lossMaking ? 'text-bad' : '') + '">' + safetyMoney(o.projectedContributionGbp) + '</td><td>' + escapeHtml((o.trustedMinutes ?? '—') + ' / ' + (o.monitoredMinutes ?? '—')) + '</td></tr>').join('') + '</table>';
  }
  if (safety.actions && safety.actions.length) {
    html += '<h3 style="margin-top:14px;">Recommended actions (not executed)</h3><ul class="sub">' + safety.actions.map((a) => '<li>' + escapeHtml(a.label) + ' — <em>' + escapeHtml(String(a.status || '').replace(/_/g, ' ')) + '</em></li>').join('') + '</ul>';
  }
  return html;
}

async function renderFinanceTab() {
  const d = await fetchBusinessControl('finance');
  const t = d.totals;
  const u = d.unitEconomics;
  let html = '<div class="section">' + sectionHeader('Finance — ' + escapeHtml(d.period.label), d.generatedAt, 'finance');
  html += '<p class="sub" style="margin-bottom:6px;">Source: ' + escapeHtml(d.connections.source) + ' · Stripe: ' + escapeHtml(d.stripeMode) + '</p>';
  html += '<p class="sub" style="margin-bottom:14px;">' + provenanceBadge('ACTUAL') + ' supplier-reported ' + provenanceBadge('ALLOCATED') + ' supplier total apportioned ' + provenanceBadge('ESTIMATED') + ' calculated ' + provenanceBadge('MANUAL') + ' entered by you ' + provenanceBadge('NOT_CONNECTED') + ' no source (never £0). A total missing any line is shown as <em>known part only</em> or not at all.</p>';
  html += renderSafetyHtml(d.safety);
  html += '<h3 style="margin-top:22px;">Profit &amp; loss</h3>';
  const headline = [
    ['Revenue ex VAT (genuine)', t.revenueExVat], ['Total operating cost', t.totalOperatingCost], ['Gross contribution', t.grossContribution], ['Operating contribution', t.operatingContribution], ['Marketing', t.marketing],
  ];
  html += '<div class="cards">' + headline.map(([label, total]) => {
    const dt = describeTotal(total);
    return bcCard(label, escapeHtml(dt.text), dt.incomplete ? '<span class="text-warn">' + escapeHtml(dt.note) + '</span>' : 'complete', label === 'Operating contribution' ? 'bc-primary' : '');
  }).join('') + '</div>';

  html += '<h3 style="margin-top:22px;">Lines</h3><table class="pnl-table"><tr><th>Line</th><th>Amount</th><th>Source</th><th>Basis</th></tr>';
  for (const section of Object.keys(FINANCE_SECTION_TITLES)) {
    const ls = d.lines.filter((x) => x.section === section);
    if (!ls.length) continue;
    html += '<tr class="pnl-section"><td colspan="4">' + FINANCE_SECTION_TITLES[section] + '</td></tr>';
    for (const l of ls) {
      html += '<tr><td>' + escapeHtml(l.label) + '</td><td class="num">' + escapeHtml(formatGbpOrMissing(l.amountGbp)) + '</td><td>' + provenanceBadge(l.provenance) + (l.stale ? ' <span class="text-warn">re-check</span>' : '') + '</td><td class="customer-sub cell-wrap">' + escapeHtml(l.basis || '') + '</td></tr>';
    }
  }
  html += '</table>';

  const unit = (v) => (v && v.amountGbp !== null ? escapeHtml(formatGbpOrMissing(v.amountGbp)) + (v.partial ? ' <span class="text-warn">(known part only)</span>' : v.complete === false ? ' <span class="text-warn">(incomplete)</span>' : '') : '—');
  html += '<h3 style="margin-top:22px;">Unit economics</h3><table class="fact-table">' +
    '<tr><td>Accounts with access (any kind)</td><td>' + fmtNum(u.accountsWithAccess) + '</td></tr>' +
    '<tr><td>Genuine paying customers</td><td>' + fmtNum(u.genuinePayingCustomers) + '</td></tr>' +
    '<tr><td>Operating cost per account with access</td><td>' + unit(u.operatingCostPerAccountWithAccess) + '</td></tr>' +
    '<tr><td>Telephony per account with access</td><td>' + unit(u.telephonyPerAccountWithAccess) + '</td></tr>' +
    '<tr><td>Revenue ex VAT per genuine paying customer</td><td>' + unit(u.revenueExVatPerGenuinePayingCustomer) + '</td></tr>' +
    '<tr><td>Monitored minutes (delivered unknown-caller calls)</td><td>' + (u.monitoredMinutes === null ? '—' : escapeHtml(u.monitoredMinutes)) + '</td></tr>' +
    '<tr><td>Customer acquisition cost</td><td>' + provenanceBadge('NOT_CONNECTED') + ' <span class="customer-sub">' + escapeHtml(u.customerAcquisitionCost.basis) + '</span></td></tr>' +
    '</table>';

  html += '<h3 style="margin-top:22px;">Fixed-cost settings</h3><table class="fact-table">' + (d.fixedCostSettings || []).map((f) =>
    '<tr><td>' + escapeHtml(f.label) + '</td><td>' + (f.configured ? escapeHtml(formatGbpOrMissing(f.valueGbp)) + '/month · ' + (f.asOf ? 'checked ' + escapeHtml(f.asOf) : 'no checked date') + (f.stale ? ' <span class="text-warn">re-check</span>' : '') : provenanceBadge('NOT_CONNECTED') + ' set <code>' + escapeHtml(f.amountVar) + '</code> and <code>' + escapeHtml(f.asOfVar) + '</code>') + '<div class="customer-sub">' + escapeHtml(f.howToFind) + '</div></td></tr>').join('') + '</table>';

  html += '<h3 style="margin-top:22px;">Data sources</h3><table class="fact-table">' +
    Object.entries(d.connections).map(([k, v]) => '<tr><td>' + escapeHtml(k) + '</td><td>' + escapeHtml(v) + '</td></tr>').join('') + '</table>';
  html += '<div class="gaps" style="margin-top:16px;">Manual costs (advertising invoices, developer programmes, insurance, accountancy…) arrive with the Finance ledger (migration 051) and manual cost schedules. Until then those lines stay <strong>Not connected</strong> — never £0.</div>';
  html += '</div>';
  document.getElementById('finance').innerHTML = html;
}

// ---------- Marketing ----------
// TEST-EXTRACT-START: buildTrackedGoLinkClient
function buildTrackedGoLinkClient(baseUrl, fields) {
  const params = new URLSearchParams();
  for (const key of ['source', 'medium', 'campaign', 'content', 'term']) {
    const v = (fields[key] || '').trim().toLowerCase().replace(/\s+/g, '-');
    if (v) params.set('utm_' + key, v);
  }
  const qs = params.toString();
  return String(baseUrl || '').replace(/\/+$/, '') + '/go' + (qs ? '?' + qs : '');
}
// TEST-EXTRACT-END: buildTrackedGoLinkClient

async function renderMarketingTab() {
  const d = await fetchBusinessControl('marketing');
  let html = '<div class="section">' + sectionHeader('Acquisition &amp; marketing — last ' + escapeHtml(d.windowDays) + ' days', d.generatedAt, 'marketing');
  const cc = d.channelComparison;
  if (cc) {
    const st = cc.stageStatus;
    html += '<h3>By channel</h3><table><tr><th>Channel</th><th class="num">Visits ' + provenanceBadge(st.visits.status) + '</th><th class="num">Signups ' + provenanceBadge(st.signups.status) + '</th><th>Paying customers ' + provenanceBadge(st.payingCustomers.status) + '</th><th>Revenue ' + provenanceBadge(st.revenue.status) + '</th><th>CAC ' + provenanceBadge(st.cac.status) + '</th></tr>' +
      cc.rows.map((r) => '<tr><td>' + escapeHtml(r.label) + (Object.keys(r.otherDetails || {}).length ? '<div class="customer-sub">' + escapeHtml(Object.entries(r.otherDetails).map(([k, n]) => k + ' ' + n).join(' · ')) + '</div>' : '') + '</td><td class="num">' + fmtNum(r.visits) + '</td><td class="num">' + fmtNum(r.registrations) + '</td><td>—</td><td>—</td><td>—</td></tr>').join('') + '</table>';
    html += '<ul class="sub">' + Object.values(st).map((s) => '<li>' + escapeHtml(s.note) + '</li>').join('') + '</ul>';
    html += '<p class="sub"><strong>Self-reported ("How did you hear about us?"):</strong> ' + escapeHtml(cc.selfReported.note) + '</p>';
  }
  html += '<h3 style="margin-top:22px;">By campaign / source</h3>';
  if (!d.rows.length) {
    html += '<div class="empty-state">No visits or registrations recorded in this window.</div>';
  } else {
    html += '<table><tr><th>Campaign / source</th><th>Channel</th><th class="num">Visits</th><th class="num">Registrations</th><th>Spend</th><th>Paying customers</th><th>CAC</th></tr>' +
      d.rows.map((r) => '<tr><td>' + escapeHtml(r.label) + '</td><td>' + escapeHtml(r.channel.replace(/_/g, ' ')) + '</td><td class="num">' + fmtNum(r.landingVisits) + '</td><td class="num">' + fmtNum(r.registrationsCompleted) + '</td>' +
        '<td>' + (r.spend && r.spend.amountGbp !== null ? escapeHtml(formatGbpOrMissing(r.spend.amountGbp)) : provenanceBadge('NOT_CONNECTED')) + '</td>' +
        '<td>' + (r.payingCustomers === null ? provenanceBadge('NOT_CONNECTED') : fmtNum(r.payingCustomers)) + '</td>' +
        '<td>' + (r.cac === null ? '—' : escapeHtml(formatGbpOrMissing(r.cac))) + '</td></tr>').join('') + '</table>';
  }
  html += '<p class="sub" style="margin-top:8px;">Visits are raw page requests (not unique people). ' + fmtNum(d.unattributed.checkoutsStarted) + ' checkout(s) and ' + fmtNum(d.unattributed.paidConversions) + ' paid conversion(s) in this window cannot be credited to any channel: ' + escapeHtml(d.unattributed.note) + '</p>';

  html += '<h3 style="margin-top:22px;">Tracked link builder</h3><p class="sub">Every channel links to the same /go page; only the tags differ. Use utm_source=instagram or facebook explicitly (a "meta" source cannot be split). Nothing is saved.</p>' +
    '<div class="manual-cost-form" id="linkBuilder">' +
    '<select id="lbPreset"><option value="">Preset…</option><option value="instagram|organic_social">Instagram (organic)</option><option value="tiktok|organic_social">TikTok (organic)</option><option value="facebook|community">Facebook group post</option><option value="linkedin|organic_social">LinkedIn</option><option value="instagram|paid_social">Instagram paid ad</option><option value="facebook|paid_social">Facebook paid ad</option><option value="tiktok|paid_social">TikTok paid ad</option><option value="|pr">PR / press</option><option value="|qr">QR code</option></select>' +
    '<input id="lbSource" placeholder="utm_source"><input id="lbMedium" placeholder="utm_medium"><input id="lbCampaign" placeholder="utm_campaign"><input id="lbContent" placeholder="utm_content (ad id)"><input id="lbTerm" placeholder="utm_term (ad set)">' +
    '</div><div class="link-output" id="lbOutput"></div>';
  html += '</div>';
  document.getElementById('marketing').innerHTML = html;

  const byId = (id) => document.getElementById(id);
  const update = () => {
    byId('lbOutput').textContent = buildTrackedGoLinkClient(window.location.origin, { source: byId('lbSource').value, medium: byId('lbMedium').value, campaign: byId('lbCampaign').value, content: byId('lbContent').value, term: byId('lbTerm').value });
  };
  byId('lbPreset').addEventListener('change', (e) => { const [s, m] = e.target.value.split('|'); if (s !== undefined) { byId('lbSource').value = s; byId('lbMedium').value = m || ''; } update(); });
  for (const id of ['lbSource', 'lbMedium', 'lbCampaign', 'lbContent', 'lbTerm']) byId(id).addEventListener('input', update);
  update();
}
