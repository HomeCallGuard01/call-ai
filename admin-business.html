<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call Guard — Admin Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #0b1220; color: white; font-size: 15px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 32px; background: #030712; border-bottom: 1px solid #1e293b; }
  .topbar-title { font-size: 19px; font-weight: 700; }
  .admin-badge { background: #0e7490; color: #cffafe; font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid #22d3ee; }

  /* Dashboard Cleanup (2026-09): "Operations dashboard" / "View Customer
     Dashboard" cross-links are gone — this is now the single admin
     destination, so there is nothing to navigate away to and no reason
     to ever send an admin into the consumer /dashboard. */
  .topbar-action { color: #93a3b8; text-decoration: none; font-size: 13px; padding: 8px 14px; border: 1px solid #1e293b; border-radius: 6px; background: none; cursor: pointer; font-family: inherit; }
  .topbar-action:hover { color: #e2e8f0; border-color: #334155; }

  .main { padding: 24px 32px 48px; max-width: 1480px; margin: 0 auto; }
  h2 { margin: 0; font-size: 16px; color: #e2e8f0; }
  h3 { margin: 0 0 10px; font-size: 13px; color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.5px; }
  .section { margin-bottom: 30px; }
  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #1e293b; }
  .last-updated { font-size: 12px; color: #64748b; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .card { background: #111a2e; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; }
  .card .label { font-size: 11.5px; color: #93a3b8; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; color: #e2e8f0; }
  .card .sub { font-size: 11.5px; color: #64748b; margin-top: 4px; }
  .card .est { color: #fbbf24; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1e293b; }
  th { color: #93a3b8; font-weight: 600; font-size: 11.5px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .badge-GREEN { background: #064e3b; color: #6ee7b7; border: 1px solid #10b981; }
  .badge-AMBER { background: #451a03; color: #fbbf24; border: 1px solid #f59e0b; }
  .badge-RED { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
  .gaps { background: #1c1608; border: 1px solid #78350f; border-radius: 8px; padding: 14px 18px; font-size: 13px; color: #fbbf24; }
  .gaps li { margin-bottom: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .loading, .error { color: #93a3b8; padding: 40px; text-align: center; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; margin-left: 6px; vertical-align: middle; }
  .tag-confirmed { background: #064e3b; color: #6ee7b7; border: 1px solid #10b981; }
  .tag-estimated { background: #451a03; color: #fbbf24; border: 1px solid #f59e0b; }
  .headline { background: #0d1526; border: 1px solid #1e293b; border-radius: 12px; padding: 20px 24px; margin-bottom: 30px; }
  .headline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 14px; }
  .headline-item .label { font-size: 11.5px; color: #93a3b8; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .headline-item .value { font-size: 26px; font-weight: 800; color: #e2e8f0; }
  .headline-item .value.incomplete { color: #fbbf24; font-size: 18px; }

  /* --- Tab navigation (Dashboard Cleanup, 2026-09) ---
     Strong, unmistakable contrast per the explicit UX requirement: the
     active tab gets a solid cyan fill (#22d3ee, this dashboard's own
     existing accent colour — already used for .admin-badge and every
     action button), not just a border or a text-colour change, so it
     cannot blend into the dark navy background the way the old
     low-contrast .topbar-link nav did. */
  .tab-nav { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #1e293b; padding-bottom: 0; }
  .tab-button {
    background: #111a2e;
    color: #93a3b8;
    border: 1px solid #1e293b;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    top: 1px;
  }
  .tab-button:hover { color: #e2e8f0; background: #16243c; }
  .tab-button[aria-current="page"] {
    background: #22d3ee;
    color: #04222b;
    border-color: #22d3ee;
  }
  .tab-button .tab-flag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    background: #450a0a;
    color: #fca5a5;
  }
  .tab-button[aria-current="page"] .tab-flag { background: #04222b; color: #fecaca; }
  .tab-panel[hidden] { display: none; }

  /* --- Ported from the retired admin.html (Operations content) --- */
  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .stat-card { background: #030712; border: 1px solid #1e293b; border-radius: 10px; padding: 18px 20px; }
  .stat-number { font-size: 26px; font-weight: 700; color: white; font-variant-numeric: tabular-nums; }
  .stat-number.warn { color: #f59e0b; }
  .stat-number.good { color: #34d399; }
  .stat-label { margin-top: 6px; font-size: 12.5px; color: #93a3b8; }
  .empty-state { color: #93a3b8; font-size: 14px; padding: 8px 0; }
  .customer-table-wrap { overflow-x: auto; }
  .customer-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .customer-table th { text-align: left; color: #93a3b8; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 12px; border-bottom: 1px solid #1e293b; white-space: nowrap; }
  .customer-table td { padding: 10px 12px; border-bottom: 1px solid #1e293b; white-space: nowrap; }
  .customer-table tr:last-child td { border-bottom: none; }
  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #1e293b; }
  .status-pill.good { background: #14532d; color: #86efac; }
  .status-pill.warn { background: #78350f; color: #fdba74; }
  .status-pill.bad { background: #7f1d1d; color: #fca5a5; }
  .status-pill.classification { background: #312e81; color: #c7d2fe; }
  .columns-3-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
  .subcards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .subcards > .card { padding: 18px; }
  .list-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #1e293b; }
  .list-item:last-child { border-bottom: none; }
  .list-icon { font-size: 17px; width: 24px; text-align: center; flex-shrink: 0; }
  .list-details { flex: 1; min-width: 0; }
  .list-title { font-weight: 600; font-size: 13.5px; }
  .list-title.severity-high { color: #f87171; }
  .list-title.severity-medium { color: #fbbf24; }
  .list-meta { font-size: 12px; color: #93a3b8; margin-top: 2px; overflow-wrap: anywhere; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-count { font-weight: 700; font-variant-numeric: tabular-nums; }
  .search-form { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-form input { flex: 1; background: #0b1220; border: 1px solid #334155; border-radius: 6px; color: white; padding: 9px 12px; font-size: 14px; }
  .search-result { padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
  .search-result:last-child { border-bottom: none; }
  .search-result-email { font-weight: 600; font-size: 14px; }
  .search-result-meta { color: #93a3b8; margin-top: 2px; }
  .quick-action-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .quick-action-row input, .quick-action-row select { flex: 1; background: #0b1220; border: 1px solid #334155; border-radius: 6px; color: white; padding: 8px 10px; font-size: 13px; }
  button.action-button { background: #22d3ee; border: none; padding: 9px 16px; color: #04222b; font-weight: bold; font-size: 13px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  button.action-button:hover { background: #67e8f9; }
  .quick-action-result { font-size: 12px; color: #93a3b8; min-height: 16px; }
  .readiness-banner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-weight: 700; font-size: 14px; }
  .readiness-banner.not_ready { background: #450a0a; color: #fecaca; border: 1px solid #ef4444; }
  .readiness-banner.ready_with_open_items { background: #422006; color: #fde68a; border: 1px solid #f59e0b; }
  .readiness-banner.ready { background: #052e1a; color: #bbf7d0; border: 1px solid #22c55e; }
  .readiness-item { padding: 12px 0; border-bottom: 1px solid #1e293b; }
  .readiness-item:last-child { border-bottom: none; }
  .readiness-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .readiness-title { font-weight: 600; font-size: 13px; }
  .readiness-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; }
  .readiness-badge.blocker { background: #450a0a; color: #fca5a5; }
  .readiness-badge.high { background: #431407; color: #fdba74; }
  .readiness-badge.medium { background: #422006; color: #fde68a; }
  .readiness-badge.done { background: #064e3b; color: #6ee7b7; }
  .readiness-detail { font-size: 12px; color: #93a3b8; margin-top: 6px; line-height: 1.5; }

  @media (max-width: 1300px) {
    .stat-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 1024px) {
    .columns-3-1 { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .stat-grid, .subcards { grid-template-columns: 1fr 1fr; }
    .tab-nav { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="topbar-title">Home Call Guard</span>
    <span class="admin-badge">Admin</span>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button type="button" class="topbar-action" onclick="loadAll();">Refresh</button>
    <form action="/logout" method="POST" style="margin:0;">
      <button type="submit" class="topbar-action">Log out</button>
    </form>
  </div>
</div>

<div class="main">
  <nav class="tab-nav" id="tabNav" role="tablist" aria-label="Admin dashboard sections">
    <button type="button" class="tab-button" id="tabBtn-business" role="tab" onclick="switchTab('business')">Business</button>
    <button type="button" class="tab-button" id="tabBtn-customers" role="tab" onclick="switchTab('customers')">Customers</button>
    <button type="button" class="tab-button" id="tabBtn-operations" role="tab" onclick="switchTab('operations')">Operations</button>
    <button type="button" class="tab-button" id="tabBtn-systemhealth" role="tab" onclick="switchTab('systemhealth')">System Health</button>
  </nav>

  <div id="business" class="tab-panel" role="tabpanel"><div class="loading">Loading…</div></div>
  <div id="customers" class="tab-panel" role="tabpanel" hidden><div class="loading">Loading…</div></div>
  <div id="operations" class="tab-panel" role="tabpanel" hidden><div class="loading">Loading…</div></div>
  <div id="systemhealth" class="tab-panel" role="tabpanel" hidden><div class="loading">Loading…</div></div>
</div>

<script>
// ============================================================
// Shared formatting helpers
// ============================================================
function fmtGbp(n) {
  if (n === null || n === undefined) return '—';
  return '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n) { return (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-GB'); }
function badge(status) { return '<span class="badge badge-' + status + '">' + status + '</span>'; }
function card(label, value, sub, isEstimate) {
  return '<div class="card"><div class="label">' + label + '</div><div class="value' + (isEstimate ? ' est' : '') + '">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}
function tag(kind) { return '<span class="tag tag-' + kind + '">' + kind + '</span>'; }
function headlineItem(label, value, incomplete) {
  return '<div class="headline-item"><div class="label">' + label + '</div><div class="value' + (incomplete ? ' incomplete' : '') + '">' + value + '</div></div>';
}

// TEST-EXTRACT-START: formatCurrency
function formatCurrency(money) {
  if (!money || !money.available) return "—";
  return new Intl.NumberFormat("en-GB", {
    style: "currency",
    currency: (money.currency || "gbp").toUpperCase(),
  }).format(money.amount);
}
// TEST-EXTRACT-END: formatCurrency

// TEST-EXTRACT-START: formatProtectionRate
function formatProtectionRate(rate) {
  return rate === null || rate === undefined ? "No calls yet" : `${rate}%`;
}
// TEST-EXTRACT-END: formatProtectionRate

// TEST-EXTRACT-START: describeActivityEvent
function describeActivityEvent(event) {
  const email = event.email || "Unknown customer";

  if (event.type === "signup") {
    return { icon: "🆕", title: `${email} signed up`, meta: event.at };
  }

  if (event.type.startsWith("subscription_")) {
    const status = event.type.replace("subscription_", "");
    return { icon: "💳", title: `${email} — subscription ${status}`, meta: event.at };
  }

  return { icon: "•", title: `${email} — ${event.type}`, meta: event.at };
}
// TEST-EXTRACT-END: describeActivityEvent

// TEST-EXTRACT-START: describeAlert
function describeAlert(alert) {
  const email = alert.email || (alert.householdId ? alert.householdId.slice(0, 8) : "Unknown");
  const severityClass = alert.severity === "high" ? "severity-high" : "severity-medium";

  if (alert.type === "provisioning_failed") {
    return { icon: "📵", className: severityClass, title: `Provisioning failed — ${email}`, meta: alert.message };
  }

  if (alert.type === "webhook_failed") {
    return { icon: "⚠️", className: severityClass, title: "Webhook processing failed", meta: alert.message };
  }

  return { icon: "•", className: severityClass, title: alert.type, meta: alert.message };
}
// TEST-EXTRACT-END: describeAlert

// TEST-EXTRACT-START: formatQuickActionResult
function formatQuickActionResult(result) {
  if (!result || !result.attempted) {
    return "Not attempted — household already has a number, or has reached the maximum retry attempts.";
  }

  if (result.success) {
    return `Provisioned successfully: ${result.twilioNumber}`;
  }

  return `Failed: ${result.error}`;
}
// TEST-EXTRACT-END: formatQuickActionResult

// TEST-EXTRACT-START: formatLaunchReadinessBadge
function formatLaunchReadinessBadge(item) {
  const labels = { blocker: "Blocker", high: "High", medium: "Medium" };
  if (item.status === "done") return { label: "Done", className: "done" };
  return { label: labels[item.severity] || item.severity, className: item.severity };
}
// TEST-EXTRACT-END: formatLaunchReadinessBadge

// TEST-EXTRACT-START: describeReadinessBanner
function describeReadinessBanner(summary) {
  if (summary.status === "not_ready") {
    return {
      className: "not_ready",
      text: `Not ready — ${summary.blockersCount} open blocker${summary.blockersCount === 1 ? "" : "s"}`,
    };
  }

  if (summary.status === "ready_with_open_items") {
    return {
      className: "ready_with_open_items",
      text: `Ready with open items — ${summary.openCount} outstanding launch check${summary.openCount === 1 ? "" : "s"}`,
    };
  }

  return { className: "ready", text: "Ready — no outstanding launch checks" };
}
// TEST-EXTRACT-END: describeReadinessBanner

// TEST-EXTRACT-START: describeAdminAction
function describeAdminAction(action) {
  if (action.type === "retry_provisioning") {
    const outcome = formatQuickActionResult(action.result);
    return { icon: "🔁", title: `Retry provisioning — ${action.email || action.householdId}`, meta: `${outcome} · ${action.at}` };
  }

  if (action.type === "grant_complimentary") {
    const outcome = action.result && action.result.granted === false
      ? `Refused (active ${action.result.existingEntitlement ? action.result.existingEntitlement.source : "paid"} entitlement)`
      : "Granted";
    return { icon: "🎁", title: `Grant complimentary — ${action.email || action.householdId}`, meta: `${outcome} · ${action.at}` };
  }

  if (action.type === "revoke_complimentary") {
    const outcome = action.result && action.result.revoked ? "Revoked" : `Not revoked (${action.result ? action.result.reason : "unknown"})`;
    return { icon: "↩️", title: `Revoke complimentary — ${action.email || action.householdId}`, meta: `${outcome} · ${action.at}` };
  }

  return { icon: "•", title: action.type, meta: action.at };
}
// TEST-EXTRACT-END: describeAdminAction

// ============================================================
// Tab switching — one visible panel at a time, active tab has a
// solid-fill, high-contrast state (never just text colour/underline).
// ============================================================
const TAB_NAMES = ['business', 'customers', 'operations', 'systemhealth'];

function switchTab(name) {
  for (const t of TAB_NAMES) {
    document.getElementById(t).hidden = t !== name;
    const btn = document.getElementById('tabBtn-' + t);
    if (t === name) {
      btn.setAttribute('aria-current', 'page');
    } else {
      btn.removeAttribute('aria-current');
    }
  }
  window.location.hash = name;
}

function initialTab() {
  const fromHash = (window.location.hash || '').replace('#', '');
  return TAB_NAMES.includes(fromHash) ? fromHash : 'business';
}

// ============================================================
// Data loading — two existing, unchanged JSON endpoints:
// /admin/api/business/overview (Business/Customers/System Health tabs)
// /admin/api/overview (Operations tab)
// ============================================================
let lastBusinessData = null;
let lastOperationsData = null;
let showAllCustomers = false;

async function loadAll() {
  await Promise.all([loadBusinessOverview(), loadOperationsOverview()]);
}

async function loadBusinessOverview() {
  try {
    const res = await fetch('/admin/api/business/overview', { credentials: 'include' });
    if (res.status === 403 || res.status === 302) {
      setUnauthorized();
      return;
    }
    if (!res.ok) {
      showTabError('business', 'Failed to load (' + res.status + ')');
      showTabError('customers', 'Failed to load (' + res.status + ')');
      showTabError('systemhealth', 'Failed to load (' + res.status + ')');
      return;
    }
    const d = await res.json();
    lastBusinessData = d;
    renderBusinessTab(d);
    renderCustomersTab(d);
    renderSystemHealthTab(d);
  } catch (err) {
    showTabError('business', 'Failed to load: ' + err.message);
  }
}

async function loadOperationsOverview() {
  try {
    const res = await fetch('/admin/api/overview', { credentials: 'include' });
    if (res.status === 403 || res.status === 302) {
      setUnauthorized();
      return;
    }
    if (!res.ok) {
      showTabError('operations', 'Failed to load (' + res.status + ')');
      return;
    }
    const d = await res.json();
    lastOperationsData = d;
    renderOperationsTab(d);
  } catch (err) {
    showTabError('operations', 'Failed to load: ' + err.message);
  }
}

function setUnauthorized() {
  for (const t of TAB_NAMES) showTabError(t, 'Not authorized.');
}
function showTabError(tab, message) {
  document.getElementById(tab).innerHTML = '<div class="error">' + message + '</div>';
}

// ============================================================
// BUSINESS TAB — leads with real customers/real paying/real MRR and
// genuine profitability; raw/test totals live in Operations instead,
// never presented as commercial performance here.
// ============================================================
function renderBusinessTab(d) {
  let html = '';

  const g = d.customers.genuine;
  const pc = d.profitability.confirmedMonthToDate;
  const abnormal = d.fairUse.overHardThresholdCount > 0 ? (d.fairUse.overHardThresholdCount + ' household(s) over hard threshold')
    : (d.fairUse.approachingCount > 0 ? (d.fairUse.approachingCount + ' approaching threshold') : 'None');

  html += '<div class="headline"><div class="section-header" style="border:none;margin:0;padding:0;"><h2>At a glance ' + badge(d.systemHealth.overall) + '</h2><span class="last-updated">Last updated ' + new Date(d.generatedAt).toLocaleString('en-GB') + '</span></div><div class="headline-grid">';
  if (g && g.genuineCustomers !== undefined) {
    html += headlineItem('Real customers', fmtNum(g.genuineCustomers));
    html += headlineItem('Real paying customers', fmtNum(g.genuinePayingCustomers));
    html += headlineItem('Real MRR ' + tag('confirmed'), d.revenue.confirmedMrr.available ? fmtGbp(d.revenue.confirmedMrr.amount) : '—');
  } else {
    html += headlineItem('Real customers', 'unavailable' + (g && g.reason ? ' (' + g.reason + ')' : ''), true);
  }
  html += headlineItem('Collected this month ' + tag('confirmed'), d.revenue.stripe.available ? fmtGbp(d.revenue.stripe.grossRevenueMtdGbp) : '—');
  if (pc) {
    const profitLabel = pc.profit.operatingProfitStatus === 'CONFIRMED' ? fmtGbp(pc.profit.operatingProfitGbp) : 'INCOMPLETE';
    html += headlineItem('Operating profit ' + tag('confirmed'), profitLabel, pc.profit.operatingProfitStatus !== 'CONFIRMED');
    if (pc.profit.operatingProfitStatus !== 'CONFIRMED') {
      html += headlineItem('Missing cost inputs', pc.profit.missingCostInputs.join(', ') || '—', true);
    }
  }
  html += headlineItem('Abnormal cost', abnormal);
  html += '</div></div>';

  html += '<div class="section"><div class="section-header"><h2>Real customers ' + tag('confirmed') + '</h2></div><div class="cards">';
  if (g && g.genuineCustomers !== undefined) {
    html += card('Real customers', fmtNum(g.genuineCustomers), 'excludes unclassified — never assumed genuine');
    html += card('Real paying customers', fmtNum(g.genuinePayingCustomers));
    html += card('Real, Stripe-paying customers', fmtNum(g.genuineStripePayingCustomers), 'basis for Real MRR');
    html += card('Active protected (real)', fmtNum(g.activeProtectedGenuineCustomers));
    html += '</div>';
  } else {
    html += '</div><div class="error">Classification data unavailable' + (g && g.reason ? ': ' + g.reason : '') + '</div>';
  }
  html += '</div>';

  const rev = d.revenue, cost = d.costs, profit = d.profitability;
  html += '<div class="section"><div class="section-header"><h2>Revenue (MTD)</h2></div><div class="cards">';
  html += card('Stripe gross MTD ' + tag('confirmed'), rev.stripe.available ? fmtGbp(rev.stripe.grossRevenueMtdGbp) : 'unavailable');
  html += card('Stripe fees MTD ' + tag('confirmed'), rev.stripe.available ? fmtGbp(rev.stripe.stripeFeesMtdGbp) : 'unavailable');
  html += card('Apple gross MTD ' + tag('estimated'), fmtGbp(rev.apple.grossRevenueEstimateGbp), rev.apple.note, true);
  html += card('Real MRR ' + tag('confirmed'), rev.confirmedMrr.available ? fmtGbp(rev.confirmedMrr.amount) : 'unavailable', 'Stripe-only, genuine paying customers only');
  html += card('MRR (all sources/accounts) ' + tag('estimated'), rev.mrr.available ? fmtGbp(rev.mrr.amount) : 'unavailable', 'includes Apple estimate + test/admin/reviewer accounts', true);
  html += card('VAT rate', (rev.vatRate * 100).toFixed(0) + '%');
  html += '</div></div>';

  html += '<div class="section"><div class="section-header"><h2>Costs</h2></div><div class="cards">';
  html += card('Twilio spend today ' + tag('confirmed'), cost.twilio.available ? fmtGbp(cost.twilio.spendTodayGbp) : 'unavailable');
  html += card('Twilio spend MTD ' + tag('confirmed'), cost.twilio.available ? fmtGbp(cost.twilio.spendMtdGbp) : 'unavailable');
  if (cost.twilio.available) {
    html += card('— number rental MTD', fmtGbp(cost.twilio.spendMtdSplit.numberRentalGbp));
    html += card('— call usage MTD', fmtGbp(cost.twilio.spendMtdSplit.callUsageGbp));
  }
  html += card('Twilio numbers', cost.twilio.available ? fmtNum(cost.twilio.numberCount) : '—');
  html += card('Twilio balance', cost.twilio.available ? (cost.twilio.balance.amount + ' ' + cost.twilio.balance.currency) : 'unavailable');
  html += card('OpenAI cost today ' + tag('estimated'), fmtGbp(cost.openai.today.estimatedCostGbp), 'assumes ' + cost.openai.today.assumedAvgMinutesPerCall + ' min/call', true);
  html += card('OpenAI cost MTD ' + tag('estimated'), fmtGbp(cost.openai.monthToDate.estimatedCostGbp), null, true);
  const fcs = cost.fixedMonthlyCostsStatus;
  html += card('Railway (fixed)', fcs.railway.configured ? fmtGbp(fcs.railway.valueGbp) + '/mo' : 'NOT CONFIGURED', null, !fcs.railway.configured);
  html += card('Supabase (fixed)', fcs.supabase.configured ? fmtGbp(fcs.supabase.valueGbp) + '/mo' : 'NOT CONFIGURED', null, !fcs.supabase.configured);
  html += card('Resend (fixed)', fcs.resend.configured ? fmtGbp(fcs.resend.valueGbp) + '/mo' : 'NOT CONFIGURED', null, !fcs.resend.configured);
  html += '</div></div>';

  if (pc) {
    html += '<div class="section"><div class="section-header"><h2>Profitability — CONFIRMED (MTD) ' + tag('confirmed') + '</h2></div><div class="cards">';
    html += card('Net revenue ex-VAT', fmtGbp(pc.revenue.netRevenueExVatGbp));
    html += card('Variable costs (Stripe fees + Twilio)', fmtGbp(pc.costs.totalVariableCostsGbp));
    html += card('Contribution', fmtGbp(pc.profit.contributionGbp));
    html += card('Contribution margin', pc.profit.contributionMarginPercent !== null ? pc.profit.contributionMarginPercent + '%' : '—');
    if (pc.profit.operatingProfitStatus === 'CONFIRMED') {
      html += card('Fixed costs', fmtGbp(pc.costs.fixedMonthlyCostsGbp));
      html += card('Operating profit', fmtGbp(pc.profit.operatingProfitGbp));
      html += card('Operating margin', pc.profit.operatingMarginPercent !== null ? pc.profit.operatingMarginPercent + '%' : '—');
    } else {
      html += card('Operating profit', 'INCOMPLETE', 'missing: ' + pc.profit.missingCostInputs.join(', '), true);
    }
    html += card('Cost per real paying customer', fmtGbp(pc.perCustomer.costPerGenuinePayingCustomerGbp));
    html += '</div></div>';
  } else {
    html += '<div class="section"><div class="error">Confirmed profitability unavailable — Stripe data could not be retrieved.</div></div>';
  }

  if (profit.monthToDate) {
    const p = profit.monthToDate;
    html += '<div class="section"><div class="section-header"><h2>Profitability — ESTIMATED, all sources/accounts (MTD) ' + tag('estimated') + '</h2></div><div class="cards">';
    html += card('Net revenue ex-VAT', fmtGbp(p.revenue.netRevenueExVatGbp));
    html += card('Total variable costs', fmtGbp(p.costs.totalVariableCostsGbp));
    html += card('Fixed costs', fmtGbp(p.costs.fixedMonthlyCostsGbp));
    html += card('Contribution', fmtGbp(p.profit.contributionGbp));
    html += card('Operating profit', fmtGbp(p.profit.operatingProfitGbp));
    html += card('Gross margin', p.profit.grossMarginPercent !== null ? p.profit.grossMarginPercent + '%' : '—');
    html += card('Avg revenue/customer', fmtGbp(p.perCustomer.avgRevenuePerCustomerGbp));
    html += card('Avg cost/customer', fmtGbp(p.perCustomer.avgVariableCostPerCustomerGbp));
    html += card('Avg contribution/customer', fmtGbp(p.perCustomer.avgContributionPerCustomerGbp));
    html += card('Break-even monitored min/customer', fmtNum(profit.breakEvenMonitoredMinutesPerCustomer), 'estimate', true);
    html += '</div></div>';
  } else {
    html += '<div class="section"><div class="error">Profitability unavailable — Stripe data could not be retrieved.</div></div>';
  }

  const cs = d.callStats;
  html += '<div class="grid2"><div class="section"><div class="section-header"><h2>Calls today</h2></div>' + callStatsTable(cs.today) + '</div>';
  html += '<div class="section"><div class="section-header"><h2>Calls MTD</h2></div>' + callStatsTable(cs.monthToDate) + '</div></div>';

  html += '<div class="section"><div class="section-header"><h2>Fair use — top Unknown-caller volume this month (count-based proxy, not £)</h2></div>';
  html += '<table><tr><th>Household</th><th>Unknown calls (MTD)</th><th>Tier</th></tr>';
  for (const h of d.fairUse.households) {
    const tierBadge = h.tier === 'over_hard_threshold' ? badge('RED') : h.tier === 'approaching_threshold' ? badge('AMBER') : badge('GREEN');
    html += '<tr><td>' + (h.email || h.householdId) + '</td><td>' + h.unknownCallCount + '</td><td>' + tierBadge + ' ' + h.tier + '</td></tr>';
  }
  if (d.fairUse.households.length === 0) html += '<tr><td colspan="3" style="color:#64748b;">No Unknown-caller calls recorded this month.</td></tr>';
  html += '</table><div class="sub" style="margin-top:8px;color:#64748b;">Warning threshold: ' + d.fairUse.thresholds.warningCallsPerMonth + ' calls/month. Hard threshold: ' + d.fairUse.thresholds.hardCallsPerMonth + ' calls/month. Visibility only — nothing is automatically restricted.</div></div>';

  html += acquisitionSection(d.acquisition);

  html += '<div class="section"><div class="section-header"><h2>Production release</h2></div><div class="cards">';
  html += card('Backend commit', d.release.backend.gitCommitSha || 'UNCONFIRMED', d.release.backend.note);
  html += card('Backend branch', d.release.backend.gitBranch || 'UNCONFIRMED');
  html += card('Environment', d.release.backend.environmentName);
  html += card('Android version', d.release.mobile.android.appVersion + ' (build ' + d.release.mobile.android.versionCode + ')', d.release.mobile.android.confidence);
  html += card('iOS version', d.release.mobile.ios.appVersion + ' (build ' + d.release.mobile.ios.buildNumber + ')', d.release.mobile.ios.confidence);
  html += '</div></div>';

  html += '<div class="section"><h3>Known gaps in this dashboard (not faked)</h3><div class="gaps"><ul>';
  for (const gap of d.knownGaps) html += '<li>' + gap + '</li>';
  html += '</ul></div></div>';

  document.getElementById('business').innerHTML = html;
}

function callStatsTable(cs) {
  if (!cs.available) return '<div class="error">Unavailable: ' + cs.reason + '</div>';
  return '<table>' +
    row('Total calls', cs.totalCalls) +
    row('Known contact', cs.knownContactCalls) +
    row('Unknown monitored', cs.unknownMonitoredCalls) +
    row('Safe', cs.safeCalls) +
    row('Suspicious', cs.suspiciousCalls) +
    row('High risk', cs.highRiskCalls) +
    row('Warnings sent', cs.warningsSent) +
    row('Terminated by HCG', cs.callsTerminatedByHcg) +
    row('Avg risk score', cs.averageRiskScore) +
    '</table>';
}
function row(label, value) { return '<tr><td>' + label + '</td><td>' + fmtNum(value) + '</td></tr>'; }

function acquisitionRawFunnelTable(snapshot) {
  const f = snapshot.rawFunnel;
  let html = '<table><tr><th>Stage</th><th>Count (raw, all traffic)</th></tr>';
  html += '<tr><td>Landing visits</td><td>' + fmtNum(f.landingVisits) + '</td></tr>';
  html += '<tr><td>Registrations submitted</td><td>' + fmtNum(f.registrationsSubmitted) + '</td></tr>';
  html += '<tr><td>Registrations completed</td><td>' + fmtNum(f.registrationsCompleted) + '</td></tr>';
  html += '<tr><td>Checkouts started</td><td>' + fmtNum(f.checkoutsStarted) + '</td></tr>';
  html += '<tr><td>Paid conversions</td><td>' + fmtNum(f.paidConversions) + '</td></tr>';
  html += '</table>';
  return html;
}

function acquisitionGenuineFunnelTable(snapshot) {
  const g = snapshot.classifiedGenuineCustomerFunnel;
  let html = '<table><tr><th>Stage</th><th>Count (real customers only)</th></tr>';
  html += '<tr><td>Checkouts started</td><td>' + fmtNum(g.checkoutsStarted) + '</td></tr>';
  html += '<tr><td>Paid conversions ' + tag('confirmed') + '</td><td>' + fmtNum(g.paidConversions) + '</td></tr>';
  html += '</table><div class="sub" style="margin-top:8px;color:#64748b;">Landing visits/registrations cannot be classified — no household exists yet at those stages, so they never appear in this real-customer funnel.</div>';
  return html;
}

function acquisitionSection(acquisition) {
  let html = '<div class="section"><div class="section-header"><h2>Acquisition / Website</h2></div>';

  if (!acquisition || !acquisition.available) {
    html += '<div class="error">Acquisition data unavailable' + (acquisition && acquisition.reason ? ': ' + acquisition.reason : '') + '</div></div>';
    return html;
  }

  html += '<div class="cards">';
  html += card('Landing visits (today)', fmtNum(acquisition.today.rawFunnel.landingVisits), 'raw, all traffic');
  html += card('Landing visits (MTD)', fmtNum(acquisition.monthToDate.rawFunnel.landingVisits), 'raw, all traffic');
  html += card('Checkouts started (MTD, real customers)', fmtNum(acquisition.monthToDate.classifiedGenuineCustomerFunnel.checkoutsStarted));
  html += card('Paid conversions (MTD, real customers) ' + tag('confirmed'), fmtNum(acquisition.monthToDate.classifiedGenuineCustomerFunnel.paidConversions));
  html += card('Checkout → paid conversion rate', acquisition.monthToDate.genuineConversionRatePercent !== null ? acquisition.monthToDate.genuineConversionRatePercent + '%' : '—', 'real customers only');
  html += '</div>';

  html += '<div class="grid2" style="margin-top:16px;">';
  html += '<div><h3 style="margin-bottom:8px;">Raw / all-traffic funnel (month to date)</h3>' + acquisitionRawFunnelTable(acquisition.monthToDate) + '</div>';
  html += '<div><h3 style="margin-bottom:8px;">Classified genuine-customer funnel (month to date) ' + tag('confirmed') + '</h3>' + acquisitionGenuineFunnelTable(acquisition.monthToDate) + '</div>';
  html += '</div>';

  html += '<div style="margin-top:16px;"><h3 style="margin-bottom:8px;">Top sources (month to date)</h3><table><tr><th>Source</th><th>Events</th></tr>';
  if (acquisition.monthToDate.topUtmSources.length === 0) {
    html += '<tr><td colspan="2" style="color:#64748b;">No UTM-tagged traffic recorded this month.</td></tr>';
  } else {
    for (const s of acquisition.monthToDate.topUtmSources) {
      html += '<tr><td>' + s.source + '</td><td>' + fmtNum(s.count) + '</td></tr>';
    }
  }
  html += '</table></div>';

  html += '<div class="sub" style="margin-top:12px;color:#64748b;">Landing/registration counts are raw page-request counts, not unique visitors — no cookie or session is used to deduplicate. Unclassified accounts are never counted as genuine customers. See Known gaps below for the full limitation.</div>';
  html += '</div>';
  return html;
}

// ============================================================
// CUSTOMERS TAB — defaults to genuine customers only. HCG currently
// has 0 genuine external customers, so the default view honestly shows
// that, rather than the raw historical/test list. A "Show all
// (diagnostics)" toggle reveals every historical/internal/admin/
// reviewer/qa/anonymised/unclassified account, with its classification
// visible per row — nothing is deleted or reclassified to produce
// either view.
// ============================================================
const CUSTOMER_MEMBERSHIP_LABELS = {
  active: { label: "Active", className: "good" },
  trial: { label: "Trial", className: "good" },
  payment_issue: { label: "Payment issue", className: "warn" },
  cancelled: { label: "Cancelling", className: "warn" },
  inactive: { label: "Inactive", className: "bad" },
  none: { label: "No entitlement", className: "" },
};
const CUSTOMER_PROVISIONING_CLASSNAMES = { active: "good", pending: "", failed: "bad" };

function customerRow(c, showClassification) {
  const membership = CUSTOMER_MEMBERSHIP_LABELS[c.membershipStatus] || { label: c.membershipStatus, className: "" };
  const provisioningClassName = CUSTOMER_PROVISIONING_CLASSNAMES[c.provisioningStatus] || "";
  return '<tr>' +
    '<td>' + new Date(c.signedUpAt).toLocaleString('en-GB') + '</td>' +
    '<td>' + c.email + '</td>' +
    '<td><span class="status-pill ' + membership.className + '">' + membership.label + '</span></td>' +
    '<td><span class="status-pill ' + (c.activationStatus === 'verified' ? 'good' : '') + '">' + (c.activationStatus === 'verified' ? 'Verified' : 'Not yet verified') + '</span></td>' +
    '<td><span class="status-pill ' + provisioningClassName + '">' + c.provisioningStatus + '</span></td>' +
    (showClassification ? '<td><span class="status-pill classification">' + c.classification + '</span></td>' : '') +
    '</tr>';
}

function customerTable(list, showClassification) {
  if (!list || list.length === 0) {
    return '<div class="empty-state">' + (showClassification ? 'No accounts recorded yet.' : 'No genuine customers yet — Home Call Guard has not yet acquired any genuine external customers. All historical activity is internal/test — see "Show all (diagnostics)".') + '</div>';
  }
  const rows = list.map((c) => customerRow(c, showClassification)).join('');
  return '<div class="customer-table-wrap"><table class="customer-table"><thead><tr>' +
    '<th>Signed up</th><th>Email</th><th>Membership / payment</th><th>Activation</th><th>Provisioning</th>' +
    (showClassification ? '<th>Classification</th>' : '') +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderCustomersTab(d) {
  const list = d.customers.recentList;
  let html = '<div class="section"><div class="section-header"><h2>Customers ' + (showAllCustomers ? '' : tag('confirmed')) + '</h2>' +
    '<button type="button" class="action-button" onclick="toggleCustomerDiagnostics()">' + (showAllCustomers ? 'Show genuine customers only' : 'Show all (diagnostics)') + '</button>' +
    '</div>';

  if (!list || !list.available) {
    html += '<div class="error">Customer data unavailable' + (list && list.reason ? ': ' + list.reason : '') + '</div></div>';
    document.getElementById('customers').innerHTML = html;
    return;
  }

  if (showAllCustomers) {
    html += '<p class="sub" style="margin-bottom:14px;">Every historical account — internal/test/admin/reviewer/QA/anonymised/unclassified — stored but hidden from the normal customer view. Nothing here has been deleted or reclassified.</p>';
    html += customerTable(list.all, true);
  } else {
    html += '<p class="sub" style="margin-bottom:14px;">Genuine external customers only. An unclassified or internal/test/admin/reviewer/QA account is never shown here by default.</p>';
    html += customerTable(list.genuine, false);
  }
  html += '</div>';
  document.getElementById('customers').innerHTML = html;
}

function toggleCustomerDiagnostics() {
  showAllCustomers = !showAllCustomers;
  if (lastBusinessData) renderCustomersTab(lastBusinessData);
}

// ============================================================
// SYSTEM HEALTH TAB — one canonical interpretation only (Dashboard
// Cleanup, 2026-09). The retired admin.html used a second, separate
// health-check implementation (services/healthChecks.js) that could
// disagree with this one (e.g. Twilio reachable-but-low-balance could
// show differently on each) — that second panel is gone; this table,
// sourced from services/businessMetrics/systemHealth.js via
// /admin/api/business/overview, is the only health status shown
// anywhere in this dashboard. "Configured" is deliberately not treated
// as "confirmed working" — see each component's own reason text.
// ============================================================
function renderSystemHealthTab(d) {
  let html = '<div class="section-header"><h2>System Health — ' + badge(d.systemHealth.overall) + '</h2><span class="last-updated">Last updated ' + new Date(d.generatedAt).toLocaleString('en-GB') + '</span></div>';
  html += '<div class="section"><table><tr><th>Component</th><th>Status</th><th>Detail</th></tr>';
  for (const [name, c] of Object.entries(d.systemHealth.components)) {
    html += '<tr><td>' + name + '</td><td>' + badge(c.status) + '</td><td style="color:#93a3b8;">' + c.reason + '</td></tr>';
  }
  html += '</table></div>';
  html += '<div class="sub" style="color:#64748b;">This is the single, canonical health interpretation for this dashboard — "configured" is never treated as the same thing as "confirmed working" (see each component\'s own reason above).</div>';
  document.getElementById('systemhealth').innerHTML = html;
}

// ============================================================
// OPERATIONS TAB — ported from the retired admin.html: raw/diagnostic
// account totals (moved out of the Business tab so they can never
// masquerade as commercial performance), protection activity, search,
// provisioning retry, complimentary access administration, launch
// readiness, recent activity. Uses the existing, unmodified
// /admin/api/overview endpoint and its existing /admin/api/* actions —
// no authentication/authorisation change of any kind.
// ============================================================
function renderStatCardsHtml(cards) {
  return cards.map((c) => '<div class="stat-card"><div class="stat-number' + (c.className ? ' ' + c.className : '') + '">' + c.value + '</div><div class="stat-label">' + c.label + '</div></div>').join('');
}

function renderListHtml(items, emptyMessage, describe) {
  if (!items || items.length === 0) return '<div class="empty-state">' + emptyMessage + '</div>';
  return items.map((item) => {
    const dsc = describe(item);
    return '<div class="list-item"><div class="list-icon">' + dsc.icon + '</div><div class="list-details"><div class="list-title ' + (dsc.className || '') + '">' + dsc.title + '</div><div class="list-meta">' + (dsc.meta || '') + '</div></div></div>';
  }).join('');
}

function renderCallsHtml(calls) {
  if (!calls || calls.length === 0) return '<div class="empty-state">No calls recorded yet.</div>';
  return calls.map((call) => {
    const icon = call.result === 'SCAM' ? '🚫' : '✅';
    const who = call.householdEmail || 'Unknown household';
    return '<div class="list-item"><div class="list-icon">' + icon + '</div><div class="list-details"><div class="list-title">' + call.number + ' — ' + call.result + '</div><div class="list-meta">' + who + ' · ' + call.time + '</div></div></div>';
  }).join('');
}

function renderBreakdownHtml(rows, emptyMessage) {
  if (!rows || rows.length === 0) return '<div class="empty-state">' + emptyMessage + '</div>';
  return rows.map((r) => '<div class="breakdown-row"><span>' + r.status + '</span><span class="breakdown-count">' + r.count + '</span></div>').join('');
}

function renderLaunchReadinessHtml(launchReadiness) {
  const bannerInfo = describeReadinessBanner(launchReadiness.summary);
  let html = '<div class="readiness-banner ' + bannerInfo.className + '">' + bannerInfo.text + '</div>';
  const items = launchReadiness.items;
  if (!items || items.length === 0) return html + '<div class="empty-state">Nothing outstanding.</div>';
  html += items.map((item) => {
    const b = formatLaunchReadinessBadge(item);
    return '<div class="readiness-item"><div class="readiness-header"><div class="readiness-title">' + item.title + '</div><div class="readiness-badge ' + b.className + '">' + b.label + '</div></div><div class="readiness-detail">' + item.detail + '</div></div>';
  }).join('');
  return html;
}

function renderSearchResultsHtml(results) {
  if (!results || results.length === 0) return '<div class="empty-state">No matches.</div>';
  return results.map((h) => '<div class="search-result"><div class="search-result-email">' + h.email + '</div><div class="search-result-meta">ID: ' + h.id + '<br>Number: ' + (h.twilio_number || '—') + ' · Provisioning: ' + h.twilio_provisioning_status + '<br>Status: ' + h.status + '</div></div>').join('');
}

    '<div class="quick-action-row"><input type="text" id="opRetryHouseholdId" placeholder="Household ID"><button type="button" id="opRetryProvisioningBtn" class="action-button">Retry</button></div>' +
    '<div class="quick-action-result" id="opQuickActionResult"></div>' +
    '<h3 style="margin-top:20px;">Grant complimentary access</h3>' +
    '<p style="color:#93a3b8;font-size:12.5px;margin-bottom:8px;">Complimentary — no payment taken. For an existing registered household only; does not create or imply a Stripe/RevenueCat subscription.</p>' +
    '<div class="quick-action-row"><input type="text" id="opComplimentaryHouseholdId" placeholder="Household ID"></div>' +
    '<div class="quick-action-row"><select id="opComplimentaryDuration"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option><option value="365">12 months</option><option value="custom">Custom date…</option></select><input type="date" id="opComplimentaryCustomDate" style="display:none;"></div>' +
    '<div class="quick-action-row"><input type="text" id="opComplimentaryNotes" placeholder="Reason (required)"></div>' +
    '<div class="quick-action-row"><button type="button" id="opGrantComplimentaryBtn" class="action-button">Grant complimentary — no payment taken</button><button type="button" id="opRevokeComplimentaryBtn" class="action-button">Revoke complimentary</button></div>' +
    '<div class="quick-action-result" id="opComplimentaryResult"></div>' +
    '<h3 style="margin-top:20px;">Friends &amp; Family — create invite link</h3>' +
    '<p style="color:#93a3b8;font-size:12.5px;margin-bottom:8px;">For someone with no household yet — they register/log in normally, then complimentary access is granted automatically. Single use; the link expires for redemption after 7 days if unused.</p>' +
    '<div class="quick-action-row"><select id="opInviteDuration"><option value="30">30 days</option><option value="90">90 days</option><option value="365">12 months</option></select><input type="text" id="opInviteNote" placeholder="Note (e.g. Sister, Family tester)"></div>' +
    '<div class="quick-action-row"><button type="button" id="opCreateInviteBtn" class="action-button">Create invite link</button></div>' +
    '<div class="quick-action-result" id="opInviteResult"></div>' +
    '<div id="opInviteList" style="margin-top:12px;"></div>' +
    '</div>';
  html += '</div>';

  html += '<div class="section"><div class="section-header"><h2>Launch readiness</h2></div><div class="card">' + renderLaunchReadinessHtml(data.launchReadiness) + '</div></div>';

  html += '<div class="section"><div class="section-header"><h2>Recent activity</h2></div><div class="subcards">';
  html += '<div class="card"><h3>Recent calls</h3><div>' + renderCallsHtml(data.recentActivityFeed.recentCalls) + '</div></div>';
  html += '<div class="card"><h3>Recent signups</h3><div>' + renderListHtml(data.recentActivityFeed.recentSignups, 'No signups yet.', describeActivityEvent) + '</div></div>';
  html += '<div class="card"><h3>Recent errors</h3><div>' + renderListHtml(data.recentActivityFeed.recentErrors, 'No errors — everything is healthy.', describeAlert) + '</div></div>';
  html += '<div class="card"><h3>Admin actions (this session)</h3><div>' + renderListHtml(data.recentActivityFeed.adminActions, 'No admin actions yet this session.', describeAdminAction) + '</div></div>';
  html += '</div></div>';

  document.getElementById('operations').innerHTML = html;
  wireOperationsActions();
}

function wireOperationsActions() {
  const searchForm = document.getElementById('opSearchForm');
  if (searchForm) {
    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = document.getElementById('opSearchInput').value;
      try {
        const res = await fetch('/admin/api/search?q=' + encodeURIComponent(q));
        const data = await res.json();
        document.getElementById('opSearchResults').innerHTML = renderSearchResultsHtml(data.results);
      } catch (err) {
        console.error('ADMIN SEARCH ERROR:', err);
      }
    });
  }

  const retryBtn = document.getElementById('opRetryProvisioningBtn');
  if (retryBtn) {
    retryBtn.addEventListener('click', async () => {
      const householdId = document.getElementById('opRetryHouseholdId').value.trim();
      const resultEl = document.getElementById('opQuickActionResult');
      if (!householdId) { resultEl.textContent = 'Enter a household ID first.'; return; }
      resultEl.textContent = 'Retrying…';
      try {
        const res = await fetch('/admin/api/households/' + encodeURIComponent(householdId) + '/retry-provisioning', { method: 'POST' });
        const data = await res.json();
        resultEl.textContent = formatQuickActionResult(data);
        loadOperationsOverview();
      } catch (err) {
        resultEl.textContent = 'Request failed — see console.';
        console.error('RETRY PROVISIONING ERROR:', err);
      }
    });
  }

  const durationSelect = document.getElementById('opComplimentaryDuration');
  if (durationSelect) {
    durationSelect.addEventListener('change', (e) => {
      document.getElementById('opComplimentaryCustomDate').style.display = e.target.value === 'custom' ? '' : 'none';
    });
  }

  function resolveComplimentaryEndsAt() {
    const duration = document.getElementById('opComplimentaryDuration').value;
    if (duration === 'custom') {
      const customDate = document.getElementById('opComplimentaryCustomDate').value;
      if (!customDate) return null;
      return new Date(customDate + 'T00:00:00Z').toISOString();
    }
    const days = parseInt(duration, 10);
    return new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
  }

  const grantBtn = document.getElementById('opGrantComplimentaryBtn');
  if (grantBtn) {
    grantBtn.addEventListener('click', async () => {
      const householdId = document.getElementById('opComplimentaryHouseholdId').value.trim();
      const notes = document.getElementById('opComplimentaryNotes').value.trim();
      const resultEl = document.getElementById('opComplimentaryResult');
      if (!householdId) { resultEl.textContent = 'Enter a household ID first.'; return; }
      if (!notes) { resultEl.textContent = 'A reason is required.'; return; }
      const endsAt = resolveComplimentaryEndsAt();
      if (!endsAt) { resultEl.textContent = 'Choose a custom expiry date.'; return; }
      resultEl.textContent = 'Granting complimentary access (no payment taken)…';
      try {
        const res = await fetch('/admin/api/households/' + encodeURIComponent(householdId) + '/grant-complimentary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes, endsAt }),
        });
        const data = await res.json();
        if (!res.ok) {
          resultEl.textContent = 'Failed: ' + data.error;
        } else if (data.granted === false) {
          resultEl.textContent = 'Not granted — this household already has an active ' + (data.existingEntitlement ? data.existingEntitlement.source : 'paid') + ' entitlement. Complimentary access refused to protect it.';
        } else {
          resultEl.textContent = 'Granted — complimentary, no payment taken. Expires ' + new Date(data.endsAt).toLocaleDateString('en-GB') + '.';
        }
        loadOperationsOverview();
      } catch (err) {
        resultEl.textContent = 'Request failed — see console.';
        console.error('GRANT COMPLIMENTARY ERROR:', err);
      }
    });
  }

  const revokeBtn = document.getElementById('opRevokeComplimentaryBtn');
  if (revokeBtn) {
    revokeBtn.addEventListener('click', async () => {
      const householdId = document.getElementById('opComplimentaryHouseholdId').value.trim();
      const resultEl = document.getElementById('opComplimentaryResult');
      if (!householdId) { resultEl.textContent = 'Enter a household ID first.'; return; }
      resultEl.textContent = 'Revoking…';
      try {
        const res = await fetch('/admin/api/households/' + encodeURIComponent(householdId) + '/revoke-complimentary', { method: 'POST' });
        const data = await res.json();
        resultEl.textContent = data.revoked ? 'Complimentary access revoked.' : ('Not revoked: ' + (data.reason || data.error || 'unknown'));
        loadOperationsOverview();
      } catch (err) {
        resultEl.textContent = 'Request failed — see console.';
        console.error('REVOKE COMPLIMENTARY ERROR:', err);
      }
    });
  }

  const createInviteBtn = document.getElementById('opCreateInviteBtn');
  if (createInviteBtn) {
    createInviteBtn.addEventListener('click', async () => {
      const durationDays = Number(document.getElementById('opInviteDuration').value);
      const note = document.getElementById('opInviteNote').value.trim();
      const resultEl = document.getElementById('opInviteResult');
      resultEl.textContent = 'Creating invite…';
      try {
        const res = await fetch('/admin/api/complimentary-invites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ durationDays, note }),
        });
        const data = await res.json();
        if (!res.ok) {
          resultEl.textContent = 'Failed: ' + data.error;
        } else {
          resultEl.innerHTML = 'Invite created — copy this link: <input type="text" readonly value="' + data.url + '" onclick="this.select();" style="width:100%;margin-top:6px;background:#0b1220;border:1px solid #334155;border-radius:6px;color:white;padding:8px 10px;font-size:12.5px;">';
        }
        loadInviteList();
      } catch (err) {
        resultEl.textContent = 'Request failed — see console.';
        console.error('CREATE INVITE ERROR:', err);
      }
    });
  }

  loadInviteList();
}

function renderInviteListHtml(invites) {
  if (!invites || invites.length === 0) return '<div class="empty-state">No invites created yet.</div>';
  const statusClass = { pending: 'good', redeemed: '', expired: 'warn', revoked: 'bad' };
  const rows = invites.map((inv) => {
    const status = inv.displayStatus;
    return '<div class="list-item">' +
      '<div class="list-icon">✉️</div>' +
      '<div class="list-details">' +
      '<div class="list-title">' + inv.duration_days + '-day invite' + (inv.note ? ' — ' + inv.note : '') + ' <span class="status-pill ' + (statusClass[status] || '') + '">' + status + '</span></div>' +
      '<div class="list-meta">Created ' + new Date(inv.created_at).toLocaleString('en-GB') + ' · Redemption deadline ' + new Date(inv.redemption_expires_at).toLocaleString('en-GB') +
      (inv.redeemed_at ? ' · Redeemed ' + new Date(inv.redeemed_at).toLocaleString('en-GB') + (inv.grant_outcome ? ' (' + inv.grant_outcome + ')' : '') : '') + '</div>' +
      '</div>' +
      (status === 'pending' ? '<button type="button" class="action-button" onclick="revokeInvite(\'' + inv.id + '\')">Revoke</button>' : '') +
      '</div>';
  }).join('');
  return rows;
}

async function loadInviteList() {
  const el = document.getElementById('opInviteList');
  if (!el) return;
  try {
    const res = await fetch('/admin/api/complimentary-invites');
    const data = await res.json();
    if (!res.ok || !data.available) {
      el.innerHTML = '<div class="error">Invite list unavailable' + (data.error || data.reason ? ': ' + (data.error || data.reason) : '') + '</div>';
      return;
    }
    el.innerHTML = renderInviteListHtml(data.invites);
  } catch (err) {
    el.innerHTML = '<div class="error">Failed to load invites — see console.</div>';
    console.error('LOAD INVITE LIST ERROR:', err);
  }
}

async function revokeInvite(inviteId) {
  try {
    await fetch('/admin/api/complimentary-invites/' + encodeURIComponent(inviteId) + '/revoke', { method: 'POST' });
    loadInviteList();
  } catch (err) {
    console.error('REVOKE INVITE ERROR:', err);
  }
}

// ============================================================
// Boot
// ============================================================
switchTab(initialTab());
loadAll();
</script>
</body>
</html>
